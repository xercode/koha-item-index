---
# General field configuration
general:
  properties:
    marc_data:
      store: true
      type: text
      analyzer: keyword
      index: false
    marc_data_array:
      type: object
      dynamic: true
    marc_format:
      store: true
      type: text
      analyzer: keyword
      index: false

# Search fields
search:
  boolean:
    type: boolean
    null_value: false
  integer:
    type: integer
    null_value: 0
    ignore_malformed: true
  year:
    type: short
  stdno:
    type: text
    analyzer: analyzer_stdno
    search_analyzer: analyzer_stdno
    fields:
      phrase:
        type: text
        analyzer: analyzer_phrase
        search_analyzer: analyzer_phrase
      raw:
        type: keyword
      ci_raw:
        type: keyword
        normalizer: icu_folding_normalizer
  geo_point:
     type: geo_point
  default:
    type: text
    analyzer: analyzer_standard
    search_analyzer: analyzer_standard
    fields:
      phrase:
        type: text
        analyzer: analyzer_phrase
        search_analyzer: analyzer_phrase
      raw:
        type: keyword
        normalizer: nfkc_cf_normalizer
      ci_raw:
        type: keyword
        normalizer: icu_folding_normalizer
# Facets
facet:
  default:
    type: keyword
    normalizer: facet_normalizer
# Suggestible
suggestible:
  default:
    type: completion
    analyzer: simple
    max_input_length: 100
    search_analyzer: simple
# Sort
sort:
  default:
    type: icu_collation_keyword
    index: false
    numeric: true
  cn_sort:
    type: icu_collation_keyword
    index: false
    numeric: false
# Nested item object (Bug 46309).
#
# Item-level data is indexed as a single `nested` object so that library and
# availability criteria are evaluated against the *same* item (e.g. "library X
# AND available" must hold for one item, not be split across two).
#
# This block is the Elasticsearch mapping fragment for the `items` field: it is
# cloned verbatim into the biblios index mapping by get_elasticsearch_mappings().
# The values are built at index time from the database (see
# marc_records_to_documents), NOT from MARC field mappings, so these subfields
# are injected directly into the mapping and are intentionally NOT managed
# through the search_field / search_marc_map tables nor the mappings.pl UI.
#
# Type choices follow the frozen F0 schema:
#   - keyword            exact filtering + faceting on codes/identifiers
#   - integer            numeric identifier (itemnumber), usable in inner_hits
#   - boolean            derived/computed status flags
#   - geo_point          library coordinates for geo_distance proximity search
# All four subfield types are common to Elasticsearch 7 and 8.
item:
  type: nested
  properties:
    itemnumber:
      type: integer
    homebranch:
      type: keyword
    holdingbranch:
      type: keyword
    itype:
      type: keyword
    location:
      type: keyword
    permanent_location:
      type: keyword
    ccode:
      type: keyword
    callnumber:
      type: keyword
    cn_sort:
      type: keyword
    barcode:
      type: keyword
    enumchron:
      type: keyword
    restricted:
      type: keyword
    notforloan:
      type: keyword
    onloan:
      type: keyword
    damaged:
      type: keyword
    lost:
      type: keyword
    withdrawn:
      type: keyword
    intransit:
      type: boolean
    onhold:
      type: boolean
    onrequest:
      type: boolean
    hidden_in_opac_custom:
      type: boolean
    hidden_in_opac_by_preferences:
      type: boolean
    home_geolocation:
      type: geo_point
    holding_geolocation:
      type: geo_point
